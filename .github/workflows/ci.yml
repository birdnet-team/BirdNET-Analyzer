name: Tests

on:
  pull_request:
    # `edited` fires on title/description edits too, re-running the whole
    # 3-OS x 3-Python matrix with no new commit behind it.
    types: [opened, synchronize, reopened]
    branches: [main]
    paths:
      [birdnet_analyzer/**, .github/workflows/ci.yml, tests/**, pyproject.toml]
  push:
    branches: [main]
    paths:
      [birdnet_analyzer/**, .github/workflows/ci.yml, tests/**, pyproject.toml]

concurrency:
  group: "${{ github.event.pull_request.number }}-${{ github.ref_name }}-${{ github.workflow }}"
  # Superseded PR runs are safe to cancel; a merge's CI on main is not.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  running-tests:
    runs-on: ${{ matrix.os }}
    # Backstop for a wedged run - a hung download or a native deadlock that
    # pytest-timeout cannot interrupt. Healthy jobs finish in ~2-6 min.
    timeout-minutes: 30
    env:
      # birdnet reads this at import time and skips models already present, so a
      # restored cache avoids re-fetching them from tuc.cloud. Under the workspace
      # because job-level env can use `github.workspace` but not `runner`.
      BIRDNET_APP_DATA: ${{ github.workspace }}/.birdnet-app-data
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Set up uv
        uses: astral-sh/setup-uv@v10.0.1
        with:
          # Must be explicit: the default ("auto") caches on hosted runners.
          # Restoring ~0.7 GB costs about what re-downloading the wheels does.
          enable-cache: false
      - name: Resolve birdnet pin
        id: bn
        shell: bash
        run: |
          pin=$(python -c "import tomllib; print(next(d for d in tomllib.load(open('pyproject.toml','rb'))['project']['dependencies'] if d.startswith('birdnet')))")
          echo "pin=${pin//[^A-Za-z0-9._-]/_}" >> "$GITHUB_OUTPUT"
      - name: Cache birdnet models
        uses: actions/cache@v6
        with:
          path: ${{ env.BIRDNET_APP_DATA }}
          # The birdnet pin alone decides the model set, and the files are
          # identical across Python versions, so every matrix job on an OS shares
          # one entry. birdnet re-fetches only what is missing, so a prefix hit
          # on an older entry is safe.
          key: birdnet-models-${{ runner.os }}-${{ steps.bn.outputs.pin }}
          restore-keys: |
            birdnet-models-${{ runner.os }}-
      - name: Install dependencies
        run: uv pip install --system .[embeddings,train,tests,gui-tests]
      # Outside pytest: a cold download can exceed the per-test 120s timeout, and
      # being killed mid-download would cache a truncated model.
      - name: Pre-download birdnet models
        # acoustic 3.0 + geo 3.0 ONNX are the default analyze path; acoustic 2.4
        # TF is what embeddings and custom classifiers load.
        run: python -c "import birdnet; birdnet.load('acoustic', '3.0', 'onnx', lang='en_us'); birdnet.load('acoustic', '2.4', 'tf', lang='en_us'); birdnet.load('geo', '3.0', 'onnx', lang='en_us')"
      - name: Run tests
        run: |
          python -m pytest

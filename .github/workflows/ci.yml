name: Tests

on:
  pull_request:
    types: [opened, synchronize, reopened, edited]
    branches: [main]
    paths:
      [birdnet_analyzer/**, .github/workflows/ci.yml, tests/**, pyproject.toml]
  push:
    branches: [main]
    paths:
      [birdnet_analyzer/**, .github/workflows/ci.yml, tests/**, pyproject.toml]

concurrency:
  group: "${{ github.event.pull_request.number }}-${{ github.ref_name }}-${{ github.workflow }}"
  cancel-in-progress: true

jobs:
  running-tests:
    runs-on: ${{ matrix.os }}
    env:
      IS_GITHUB_RUNNER: "true"
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: true
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Set up uv
        uses: astral-sh/setup-uv@v9.0.0
        with:
          enable-cache: true
          cache-dependency-glob: "pyproject.toml"
      - name: Install dependencies
        run: uv pip install --system .[embeddings,train,tests,gui-tests]
      - name: Run tests
        run: |
          python -m pytest

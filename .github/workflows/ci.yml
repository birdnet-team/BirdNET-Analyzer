name: Tests

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main]
    paths:
      [birdnet_analyzer/**, .github/workflows/ci.yml, tests/**, pyproject.toml]
  push:
    branches: [main]
    paths:
      [birdnet_analyzer/**, .github/workflows/ci.yml, tests/**, pyproject.toml]

concurrency:
  group: "${{ github.event.pull_request.number }}-${{ github.ref_name }}-${{ github.workflow }}"
  # Superseded PR runs are safe to cancel; a merge's CI on main is not.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  running-tests:
    runs-on: ${{ matrix.os }}
    # Backstop for a wedged run - a hung download or a native deadlock that
    # pytest-timeout cannot interrupt. Healthy jobs finish in ~2-6 min.
    timeout-minutes: 30
    env:
      # birdnet reads this at import time and skips models already present, so a
      # restored cache avoids re-fetching them from tuc.cloud. Under the workspace
      # because job-level env can use `github.workspace` but not `runner`.
      BIRDNET_APP_DATA: ${{ github.workspace }}/.birdnet-app-data
      # acoustic 3.0 + geo 3.0 ONNX are the default analyze path; acoustic 2.4 TF
      # is what embeddings and custom classifiers load. Hashed into the cache key
      # below, so editing this list invalidates the entry rather than freezing it.
      PREDOWNLOAD: "import birdnet; birdnet.load('acoustic', '3.0', 'onnx', lang='en_us'); birdnet.load('acoustic', '2.4', 'tf', lang='en_us'); birdnet.load('geo', '3.0', 'onnx', lang='en_us')"
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Set up uv
        uses: astral-sh/setup-uv@v10.0.1
        with:
          # Must be explicit: the default ("auto") caches on hosted runners.
          # Restoring ~0.7 GB costs about what re-downloading the wheels does.
          enable-cache: false
      - name: Resolve model cache key
        id: models
        shell: bash
        run: |
          python - <<'EOF' >> "$GITHUB_OUTPUT"
          import hashlib, os, re, tomllib

          deps = tomllib.load(open("pyproject.toml", "rb"))["project"]["dependencies"]
          pin = next(d for d in deps if re.match(r"birdnet\s*[=<>!~;\[]", d))
          models = hashlib.sha256(os.environ["PREDOWNLOAD"].encode()).hexdigest()[:12]
          print("key=" + re.sub(r"[^A-Za-z0-9._-]", "_", pin) + "-" + models)
          EOF
      # Must stay after checkout: the path is gitignored, and checkout's default
      # `clean` (`git clean -ffdx`) would delete the restored models.
      - name: Cache birdnet models
        uses: actions/cache@v6
        with:
          path: ${{ env.BIRDNET_APP_DATA }}
          # An exact hit skips the save, so the key has to cover everything that
          # decides the contents - the birdnet pin and the model list. The files
          # are identical across Python versions, so all matrix jobs on an OS
          # share one entry, and birdnet re-fetches only what a prefix hit missed.
          key: birdnet-models-${{ runner.os }}-${{ steps.models.outputs.key }}
          restore-keys: |
            birdnet-models-${{ runner.os }}-
      - name: Install dependencies
        run: uv pip install --system .[embeddings,train,tests,gui-tests]
      # Outside pytest: a cold download can exceed the per-test 120s timeout, and
      # being killed mid-download would cache a truncated model.
      - name: Pre-download birdnet models
        shell: bash
        run: python -c "$PREDOWNLOAD"
      - name: Run tests
        run: |
          python -m pytest

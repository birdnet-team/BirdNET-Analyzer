name: documentation

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main]
    paths:
      [docs/**, .github/workflows/documentation.yml, birdnet_analyzer/cli.py]
  push:
    branches:
      - main
    paths:
      [docs/**, .github/workflows/documentation.yml, birdnet_analyzer/cli.py]

permissions:
  contents: write

jobs:
  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Set up uv
        uses: astral-sh/setup-uv@v10.0.1
        with:
          # Re-enabling needs a cache-suffix, or this key collides with the
          # ubuntu/3.13 test job's.
          enable-cache: false
      - name: Install dependencies
        run: uv pip install --system .[docs]
      - name: Sphinx build
        run: |
          sphinx-build -E docs _build
      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
        with:
          publish_branch: gh-pages
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: _build/
          force_orphan: true

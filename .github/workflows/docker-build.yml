name: Docker

on:
  push:
    branches: [main]
    paths:
      - "Dockerfile"
      - ".dockerignore"
      - "pyproject.toml"
      - ".github/workflows/docker-build.yml"
  pull_request:
    branches: [main]
    paths:
      - "Dockerfile"
      - ".dockerignore"
      - "pyproject.toml"
      - ".github/workflows/docker-build.yml"
  release:
    types: [published]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  REGISTRY: ghcr.io
  # metadata-action lowercases this to ghcr.io/birdnet-team/birdnet-analyzer
  IMAGE_NAME: ${{ github.repository }}

jobs:
  test:
    name: Build and test image
    runs-on: ubuntu-latest
    # The emulated arm64 leg dominates; observed worst case ~18 min for the job.
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build image
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          tags: birdnet:test
          cache-from: type=gha
          cache-to: ${{ github.event_name != 'pull_request' && 'type=gha,mode=max' || '' }}

      # linux/arm64 has no tensorflow-cpu wheel, so it breaks differently from
      # amd64. Build-only (no load or smoke test under emulation) so a broken
      # arm64 fails the PR rather than the release.
      - name: Validate arm64 build
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/arm64
          cache-from: type=gha
          cache-to: ${{ github.event_name != 'pull_request' && 'type=gha,mode=max' || '' }}

      - name: Smoke test image
        run: |
          mkdir -p out
          docker run --rm \
            -v "$PWD/birdnet_analyzer/example:/audio:ro" \
            -v "$PWD/out:/out" \
            birdnet:test -m birdnet_analyzer.analyze /audio --slist /audio/species_list.txt -o /out

          output_file="out/BirdNET_SelectionTable.txt"

          if [ ! -s "$output_file" ]; then
            echo "::error::Expected output '$output_file' was not created or is empty"
            ls -la out
            exit 1
          fi

          line_count=$(wc -l < "$output_file")
          if [ "$line_count" -lt 2 ]; then
            echo "::error::Output table has no detection rows ($line_count lines)"
            cat "$output_file"
            exit 1
          fi

          # Structure only - exact model scores are covered by the pytest suite.
          header=$(head -n 1 "$output_file")
          for col in "Selection" "Begin Time (s)" "Confidence" "Begin Path"; do
            case "$header" in
              *"$col"*) ;;
              *) echo "::error::Output header is missing column: $col"; echo "Header: $header"; exit 1 ;;
            esac
          done

          echo "Docker image smoke test passed ($((line_count - 1)) detections)"

  publish:
    name: Publish to GitHub Container Registry
    needs: test
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    timeout-minutes: 90

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          # A release tagged v2.4.0 produces the tags 2.4.0, 2.4 and latest
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      - name: Build and push image
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          # Avoid "unknown/unknown" attestation entries in the GHCR package UI
          provenance: false

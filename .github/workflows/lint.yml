name: Lint

on:
  push:
    branches: [main]
    paths:
      [
        birdnet_analyzer/**,
        .github/workflows/lint.yml,
        tests/**,
        pyproject.toml,
      ]
  pull_request:
    branches: [main]
    # See the note in ci.yml: `edited` would re-run this on title/description
    # edits, with no commit behind them.
    types: [opened, synchronize, reopened]
    paths:
      [
        birdnet_analyzer/**,
        .github/workflows/lint.yml,
        tests/**,
        pyproject.toml,
      ]

jobs:
  ruff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      # ruff is a static analyzer and doesn't import the package, so skip the
      # (heavy) dependency install entirely. Keep the version in sync with the
      # ruff pin in pyproject.toml's [dev] extra.
      - name: Lint with Ruff
        uses: astral-sh/ruff-action@v4.1.0
        with:
          version: "0.15.10"

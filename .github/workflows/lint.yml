name: Lint

on:
  push:
    branches: [main]
    paths:
      [
        birdnet_analyzer/**,
        .github/workflows/lint.yml,
        tests/**,
        pyproject.toml,
      ]
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
    paths:
      [
        birdnet_analyzer/**,
        .github/workflows/lint.yml,
        tests/**,
        pyproject.toml,
      ]

jobs:
  ruff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # ruff never imports the package, so no dependency install is needed.
      # Keep this version in sync with the ruff pin in pyproject.toml's [dev].
      - name: Lint with Ruff
        uses: astral-sh/ruff-action@v4.1.0
        with:
          version: "0.15.10"
